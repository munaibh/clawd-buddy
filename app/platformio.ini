; `pio run` builds both Waveshare variants; each build drops a versioned
; factory image into ../release/<env>/ (see tools/copy_firmware.py).
[platformio]
default_envs = waveshare-146b, waveshare-146b-flipped

[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/> -<hal_ws146b/>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; Waveshare ESP32-S3-Touch-LCD-1.46B: the M5 API comes from src/hal_ws146b/.
[env:waveshare-146b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBUDDY_NO_LED
    -DBUDDY_TOUCH
    -DBUDDY_ROUND_DISPLAY
    -DBOARD_HAS_PSRAM
    -Isrc/hal_ws146b
build_src_filter = +<*> +<buddies/>
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.7
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
extra_scripts = post:tools/copy_firmware.py

; Mounted upside down in the Clawd case (hardware/).
[env:waveshare-146b-flipped]
extends = env:waveshare-146b
build_flags =
    ${env:waveshare-146b.build_flags}
    -DWS146B_ROTATE_180
